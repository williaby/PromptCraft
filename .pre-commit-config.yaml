# Pre-commit hooks. Every remote rev is pinned to a commit SHA; Renovate's
# pre-commit manager advances them. Install both stages:
#   uv run pre-commit install --hook-type pre-commit --hook-type commit-msg
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: fix-byte-order-marker
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -lll]
        additional_dependencies: ["bandit[toml]"]
        files: ^src/

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9  # v3.99.2
    hooks:
      - id: trufflehog

  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458  # v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # Commit SHAs in pinned refs are high-entropy hex, not secrets.
        exclude: ^(uv\.lock|\.pre-commit-config\.yaml|\.github/workflows/.*)$

  - repo: https://github.com/jsh9/pydoclint
    rev: 24412c5f73ad438a08146132ea86a9a72c8bd5ad  # 0.11.0
    hooks:
      - id: pydoclint
        args: [--style=google, --allow-init-docstring=True]
        files: ^src/

  - repo: https://github.com/econchick/interrogate
    rev: 4894019dc8876092bc9b6d56878798c550fad998  # 1.7.0
    hooks:
      - id: interrogate
        args: [-c, pyproject.toml, src]
        pass_filenames: false

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0  # v0.49.1
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json, --ignore-path, .markdownlintignore]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: 57217c394fff5064bedd48421fe4b6f5f73aad47  # v4.19.2
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright (strict)
        entry: uv run --frozen basedpyright
        language: system
        types: [python]
        pass_filenames: false
      - id: uv-lock-check
        name: uv.lock is current
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: no-em-dash
        name: no em-dashes (project writing rule)
        entry: "\u2014"
        language: pygrep
        types: [text]
