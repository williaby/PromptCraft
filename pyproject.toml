[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "promptcraft"
version = "0.1.0"
description = "Portable prompt refiner that turns rough prompts into standard, robust prompts for Claude and local models"
authors = [{ name = "Byron Williams", email = "manager@williamsfamilyfund.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["prompt-engineering", "llm", "prompt-refinement", "claude", "llama-cpp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
homepage = "https://github.com/williaby/PromptCraft"
repository = "https://github.com/williaby/PromptCraft"
documentation = "https://williaby.github.io/PromptCraft/"
changelog = "https://github.com/williaby/PromptCraft/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "basedpyright>=1.31.0",
    "coverage[toml]>=7.10.0",
    "nox>=2025.5.1",
    "pip-audit>=2.9.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.16.10",
]
docs = [
    "interrogate>=1.7.0",
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.6.0,<10",
    "mkdocstrings[python]>=0.30.0",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/promptcraft"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".claude/", "knowledge/"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "YTT",   # flake8-2020
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "EM",    # flake8-errmsg
    "FA",    # flake8-future-annotations
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "INP",   # flake8-no-pep420
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "TC",    # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate
    "PGH",   # pygrep-hooks
    "PL",    # pylint
    "TRY",   # tryceratops
    "FURB",  # refurb
    "RUF",   # ruff-specific
]
ignore = [
    "COM812", # conflicts with ruff format
    "ISC001", # conflicts with ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "INP001"]
"noxfile.py" = ["ANN", "INP001"]

[tool.ruff.lint.isort]
known-first-party = ["promptcraft"]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "strict"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

# ---------------------------------------------------------------------------
# Tests and coverage
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "unit: fast tests with no I/O",
    "integration: tests that cross a process or network boundary",
    "security: security-focused tests",
    "slow: tests that take more than a few seconds",
]

[tool.coverage.run]
source = ["promptcraft"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.coverage.xml]
output = "coverage.xml"

# ---------------------------------------------------------------------------
# Security and docs
# ---------------------------------------------------------------------------

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests"]
skips = ["B101", "B601"]

[tool.interrogate]
fail-under = 85
ignore-init-method = true
ignore-init-module = false
ignore-magic = true
exclude = ["tests", "noxfile.py"]
