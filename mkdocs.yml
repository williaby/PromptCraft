site_name: PromptCraft
site_description: Portable prompt refiner for Claude and local models
site_url: https://williaby.github.io/PromptCraft/
site_author: Byron Williams
copyright: Copyright 2025-2026 Byron Williams
repo_url: https://github.com/williaby/PromptCraft
repo_name: williaby/PromptCraft
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    primary: blue
    accent: cyan
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy

plugins:
  - search

nav:
  - Home: index.md
  - Architecture:
      - "ADR-001: Portable Prompt Refiner": architecture/adr-001-portable-prompt-refiner.md
      - "Phase 0 Migration Plan": architecture/phase-0-migration-plan.md
  - Standards:
      - Git Workflow: standards/git-workflow.md
  - Security:
      - Known Vulnerabilities: known-vulnerabilities.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true
