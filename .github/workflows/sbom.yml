name: SBOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    uses: ByronWilliamsCPA/.github/.github/workflows/python-sbom.yml@74cfc8e9d1ea1f6babc40bea102b3071af620942  # v11.0.1
    permissions:
      contents: read
    with:
      python-version: '3.12'
      fail-on-vulnerabilities: true
      severity-threshold: 'CRITICAL,HIGH'
      no-build: false
