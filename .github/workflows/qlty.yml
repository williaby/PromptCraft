name: Qlty

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: qlty-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR gate: block merges that introduce medium or higher issues.
  qlty-gate:
    if: github.event_name == 'pull_request'
    uses: ByronWilliamsCPA/.github/.github/workflows/python-qlty-gate.yml@82ce497cae146787ea65bf892aedfe3262a4638e  # v12.0.1
    permissions:
      contents: read
    with:
      fail-level: medium
      upstream: origin/${{ github.base_ref }}

  # Weekly full-codebase health scan, informational.
  qlty-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ByronWilliamsCPA/.github/.github/workflows/python-qlty-gate.yml@82ce497cae146787ea65bf892aedfe3262a4638e  # v12.0.1
    permissions:
      contents: read
    with:
      fail-level: high
      check-all: true
      no-fail: true
