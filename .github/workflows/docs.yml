name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: ByronWilliamsCPA/.github/.github/workflows/python-docs.yml@82ce497cae146787ea65bf892aedfe3262a4638e  # v12.0.1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      python-version: '3.12'
      docstring-threshold: 85
      deploy-to-pages: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      no-build: false
