name: Setup Assured-OSS Authentication

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        default: '3.11'
        type: string
    secrets:
      ASSURED_OSS_SERVICE_ACCOUNT:
        description: 'Google Cloud service account JSON'
        required: true
      ASSURED_OSS_PROJECT_ID:
        description: 'Google Cloud project ID'
        required: true

jobs:
  setup-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit
          disable-sudo: true
          allowed-endpoints: >
            accounts.google.com:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443
            us-python.pkg.dev:443
            oauth2.googleapis.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@62cf5bd3a4a3282316048584a6d2b150b918e83a # v2.1.7
        with:
          credentials_json: ${{ secrets.ASSURED_OSS_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.ASSURED_OSS_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ secrets.ASSURED_OSS_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker us-python.pkg.dev --quiet

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.8.17
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ inputs.python-version }}

      - name: Configure uv for Assured-OSS
        run: |
          # uv reads extra-index credentials from UV_INDEX_<NAME>_USERNAME/PASSWORD.
          # The index name "assured-oss" canonicalizes to ASSURED_OSS.
          echo "🔐 Configuring secure Assured-OSS authentication for uv..."
          ASSURED_OSS_TOKEN=$(gcloud auth print-access-token)
          {
            echo "UV_INDEX_ASSURED_OSS_USERNAME=oauth2accesstoken"
            echo "UV_INDEX_ASSURED_OSS_PASSWORD=${ASSURED_OSS_TOKEN}"
            echo "UV_EXTRA_INDEX_URL=https://us-python.pkg.dev/assured-oss/python-packages/simple/"
          } >> "$GITHUB_ENV"
          unset ASSURED_OSS_TOKEN
          echo "✅ uv configured for Assured-OSS authentication"

      - name: Diagnostic uv Information
        run: |
          echo "::group::uv Version"
          uv --version
          echo "::endgroup::"

          echo "::group::Python Version"
          python --version
          echo "::endgroup::"

      - name: Verify Assured-OSS Access
        run: |
          # Test authentication by attempting to fetch package index - secure token handling
          echo "🔍 Verifying Assured-OSS access with secure authentication..."
          {
            echo -n "Authorization: Bearer "
            gcloud auth print-access-token
          } | curl -H @- \
               "https://us-python.pkg.dev/assured-oss/python-packages/simple/" \
               --fail --silent --show-error || {
            echo "::warning::Direct header method failed, attempting alternative verification..."
            # Fallback: use temporary variable with immediate cleanup
            VERIFY_TOKEN=$(gcloud auth print-access-token)
            curl -H "Authorization: Bearer $VERIFY_TOKEN" \
                 "https://us-python.pkg.dev/assured-oss/python-packages/simple/" \
                 --fail --silent --show-error
            unset VERIFY_TOKEN
          }
          echo "✅ Assured-OSS access verified"
