name: Qlty Coverage

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  qlty-coverage:
    if: github.event.workflow_run.conclusion == 'success'
    uses: ByronWilliamsCPA/.github/.github/workflows/python-qlty-coverage.yml@74cfc8e9d1ea1f6babc40bea102b3071af620942  # v11.0.1
    permissions:
      contents: read
      actions: read
    with:
      coverage-artifact-name: coverage-reports
      coverage-file-path: coverage.xml
      workflow-run-id: ${{ github.event.workflow_run.id }}
    secrets:
      QLTY_COVERAGE_TOKEN: ${{ secrets.QLTY_COVERAGE_TOKEN }}
