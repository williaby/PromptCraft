name: Qlty Coverage

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  qlty-coverage:
    if: github.event.workflow_run.conclusion == 'success'
    uses: ByronWilliamsCPA/.github/.github/workflows/python-qlty-coverage.yml@79bf84c73af866a34f968262f2631f938c659d77  # v12.0.3
    permissions:
      contents: read
      actions: read
    with:
      coverage-artifact-name: coverage-reports
      coverage-file-path: coverage.xml
      workflow-run-id: ${{ github.event.workflow_run.id }}
    secrets:
      QLTY_COVERAGE_TOKEN: ${{ secrets.QLTY_COVERAGE_TOKEN }}
