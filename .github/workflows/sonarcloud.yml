name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    uses: ByronWilliamsCPA/.github/.github/workflows/python-sonarcloud.yml@79bf84c73af866a34f968262f2631f938c659d77  # v12.0.3
    permissions:
      contents: read
      pull-requests: write
    with:
      sonar-organization: williaby
      sonar-project-key: williaby_PromptCraft
      python-version: '3.12'
      sonar-python-version: '3.11,3.12,3.13,3.14'
      coverage-paths: coverage.xml
      no-build: false
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
