name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    uses: ByronWilliamsCPA/.github/.github/workflows/python-sonarcloud.yml@82ce497cae146787ea65bf892aedfe3262a4638e  # v12.0.1
    permissions:
      contents: read
      pull-requests: write
    with:
      sonar-organization: williaby
      sonar-project-key: williaby_PromptCraft
      python-version: '3.12'
      sonar-python-version: '3.11,3.12,3.13,3.14'
      coverage-paths: coverage.xml
      no-build: false
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
