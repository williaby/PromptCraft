name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '21 21 * * 2'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    uses: ByronWilliamsCPA/.github/.github/workflows/python-scorecard.yml@74cfc8e9d1ea1f6babc40bea102b3071af620942  # v11.0.1
    permissions:
      contents: read
      actions: read
    secrets:
      SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN }}
