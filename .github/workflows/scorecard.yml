name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '21 21 * * 2'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    uses: ByronWilliamsCPA/.github/.github/workflows/python-scorecard.yml@82ce497cae146787ea65bf892aedfe3262a4638e  # v12.0.1
    permissions:
      contents: read
      actions: read
    secrets:
      SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN }}
