name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '21 21 * * 2'
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    uses: ByronWilliamsCPA/.github/.github/workflows/python-scorecard.yml@79bf84c73af866a34f968262f2631f938c659d77  # v12.0.3
    permissions:
      contents: read
      actions: read
    secrets:
      SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN }}
