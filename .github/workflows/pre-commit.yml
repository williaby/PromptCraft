name: Pre-Commit

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    uses: ByronWilliamsCPA/.github/.github/workflows/python-precommit.yml@82ce497cae146787ea65bf892aedfe3262a4638e  # v12.0.1
    permissions:
      contents: read
    with:
      python-version: '3.12'
      no-build: false
