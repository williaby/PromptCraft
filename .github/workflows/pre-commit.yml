name: Pre-Commit

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    uses: ByronWilliamsCPA/.github/.github/workflows/python-precommit.yml@79bf84c73af866a34f968262f2631f938c659d77  # v12.0.3
    permissions:
      contents: read
    with:
      python-version: '3.12'
      no-build: false
