name: PR Validation

on:
  pull_request:
    branches:
      - main
      - feature/phase-1-development

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-lock:
    name: PR Validation
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.base.ref == 'main' ||
      github.event.pull_request.base.ref == 'feature/phase-1-development'

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history to compare with base branch when needed
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: '0.9.26'
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Verify uv sync resolves cleanly (all groups)
        run: uv sync --frozen --all-groups
