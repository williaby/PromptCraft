# Sequential test CI configuration.
#
# Sequential test execution remains the single-coverage-upload strategy that
# Codecov needs to avoid the 0% coverage race condition documented in PR #198.
# The poetry install machinery (retry loops, NVIDIA-detection branch, disk
# cleanup) is gone now that uv resolves deterministically from uv.lock.

name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - 'feature/phase-1-development'

permissions:
  contents: read
  pull-requests: write
  issues: write
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_ENVIRONMENT: true
  PROMPTCRAFT_REDIS_HOST: localhost
  PROMPTCRAFT_QDRANT_HOST: localhost
  PROMPTCRAFT_ENABLE_SERVICE_MOCKING: true
  UV_VERSION: '0.9.26'
  MYPY_CACHE_DIR: ~/.cache/mypy

jobs:
  setup-optimized:
    name: Enhanced Setup
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: 'uv.lock'
          cache-suffix: 'py3.11-hatchling-v2'

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Verify lockfile and resolve dependencies
        run: |
          uv lock --check
          uv sync --frozen --all-groups

  test:
    name: Test and Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: setup-optimized
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: 'uv.lock'
          cache-suffix: 'py${{ matrix.python-version }}-hatchling-v2'

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-groups --python ${{ matrix.python-version }}

      - name: Install system dependencies (minimal)
        run: |
          sudo apt-get update && sudo apt-get install -y redis-server libmagic-dev
          sudo systemctl start redis-server || echo "Using mocked services"
        continue-on-error: true

      - name: Run core tests with coverage
        run: |
          echo "Running core functional tests for MVP (excluding performance tests)"
          uv run --frozen --python ${{ matrix.python-version }} pytest -v \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --junitxml=junit.xml \
            -o junit_family=xunit2 \
            --tb=short \
            --maxfail=10 \
            -m "not performance and not perf" \
            tests/
        env:
          CI_ENVIRONMENT: true
          PROMPTCRAFT_REDIS_HOST: localhost
          PROMPTCRAFT_QDRANT_HOST: localhost
          PROMPTCRAFT_ENABLE_SERVICE_MOCKING: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: ${{ env.CODECOV_TOKEN != '' }} && !cancelled()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python-${{ matrix.python-version }}
          name: Coverage Report (Python ${{ matrix.python-version }})
          verbose: true
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
            htmlcov/

  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: setup-optimized
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: 'uv.lock'
          cache-suffix: 'py3.11-hatchling-v2'

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run type checking
        run: |
          echo "Running MyPy with cached stubs"
          uv run --frozen mypy src --cache-dir=${{ env.MYPY_CACHE_DIR }}

      - name: Run linting
        run: |
          echo "Running ruff format check and lint"
          uv run --frozen ruff format --check .
          uv run --frozen ruff check . --no-cache

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 6
    needs: setup-optimized
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: 'uv.lock'
          cache-suffix: 'py3.11-hatchling-v2'

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run security checks
        run: |
          echo "Running security scans"
          uv run --frozen bandit -r src -ll || echo "Bandit scan completed with findings"
          uv run --frozen pip-audit --strict || echo "pip-audit scan completed with findings"

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [setup-optimized, test, quality-checks]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.setup-optimized.result }}" == "success" && \
                "${{ needs.test.result }}" == "success" && \
                "${{ needs.quality-checks.result }}" == "success" ]]; then
            echo "Sequential CI passed with comprehensive coverage"
            echo "Codecov reporting uses single coverage upload"
          else
            echo "Sequential CI failed"
            echo "setup-optimized: ${{ needs.setup-optimized.result }}"
            echo "test: ${{ needs.test.result }}"
            echo "quality-checks: ${{ needs.quality-checks.result }}"
            exit 1
          fi

  ci-test:
    name: CI / Test
    runs-on: ubuntu-latest
    needs: [setup-optimized, test, quality-checks, security-scan]
    if: always()
    steps:
      - name: Validate all test jobs
        run: |
          if [[ "${{ needs.setup-optimized.result }}" == "success" && \
                "${{ needs.test.result }}" == "success" && \
                "${{ needs.quality-checks.result }}" == "success" && \
                "${{ needs.security-scan.result }}" == "success" ]]; then
            echo "All CI test jobs passed successfully"
          else
            echo "One or more CI test jobs failed"
            echo "setup-optimized: ${{ needs.setup-optimized.result }}"
            echo "test: ${{ needs.test.result }}"
            echo "quality-checks: ${{ needs.quality-checks.result }}"
            echo "security-scan: ${{ needs.security-scan.result }}"
            exit 1
          fi
