name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ByronWilliamsCPA/.github/.github/workflows/python-ci.yml@74cfc8e9d1ea1f6babc40bea102b3071af620942  # v11.0.1
    permissions:
      contents: read
    with:
      python-version: '3.12'
      enable-matrix-testing: true
      python-versions-pr: '["3.11", "3.12", "3.13", "3.14"]'
      python-versions-comprehensive: '["3.11", "3.12", "3.13", "3.14"]'
      coverage-threshold: 80
      no-build: false
      # No integration or security marker suites exist yet (ADR-001 Phase 0).
      run-integration-tests: false
      run-security-tests: false

  # The branch ruleset requires the bare context "CI Gate"; reusable-workflow
  # checks report as "ci / CI Gate", so this job publishes the bare name.
  ci-gate:
    name: CI Gate
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require CI success
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          if [ "$CI_RESULT" != "success" ]; then
            echo "::error::CI result was $CI_RESULT"
            exit 1
          fi
          echo "CI passed."
