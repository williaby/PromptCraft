name: Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: ByronWilliamsCPA/.github/.github/workflows/python-security-analysis.yml@74cfc8e9d1ea1f6babc40bea102b3071af620942  # v11.0.1
    permissions:
      contents: read
      pull-requests: read
    with:
      python-version: '3.12'
      fail-on-high: true
      run-bandit: true
      run-osv: true
      no-build: false

  security-gate:
    name: Security Gate Validation
    needs: [security]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require security analysis success
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          if [ "$SECURITY_RESULT" != "success" ]; then
            echo "::error::Security analysis result was $SECURITY_RESULT"
            exit 1
          fi
          echo "Security analysis passed."
